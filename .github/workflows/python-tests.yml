name: python-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline test suite
        run: |
          python -m pytest -q

      # Tests use offline fixtures and fake transports. We intentionally do not
      # install Playwright browser binaries here; the production code only
      # depends on Playwright when the user opts into the JWC source sync.